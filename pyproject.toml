[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medicare-dmepos-risk-screening"
version = "0.1.0"
description = "Statistical outlier screening for Medicare DMEPOS billing using public CMS data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "S. Suhaib A. Shah", email = "suhaibshah@hotmail.com"}
]
keywords = ["healthcare", "data-analytics", "dmepos", "medicare", "fraud-detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "duckdb>=0.9.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "pytest>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
]
snowflake = [
    "snowflake-sqlalchemy>=1.5.0",
    "snowflake-connector-python>=3.0",
]
ml = [
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "shap>=0.42",
]
streamlit = [
    "streamlit>=1.28",
    "plotly>=5.17",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 100
target-version = ['py310']